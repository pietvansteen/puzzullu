server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # data.json comes from the sync container (shared /data folder)
    location = /data.json {
        alias /data/data.json;
        add_header Cache-Control "no-cache";
    }

    # API (password-protected write actions, health, sync)
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    # the pages link css/js/svg with ?v=<version>-<hash>, so they can be cached for a day
    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # the pages themselves are always revalidated, so a new ?v= is picked up at once.
    # sync-now and other files in /data are not reachable
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
