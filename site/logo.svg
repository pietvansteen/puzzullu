<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <title>Puzzullu</title>
  <!-- Achtergrond: verwijder deze regel voor een transparante versie -->
  <rect width="400" height="400" fill="#2a3c9a"/>

  <defs>
    <!-- Alle letters in hetzelfde kader van 32 x 44, lijndikte 9 -->
    <path id="P" d="M4.5,44 V4.5 H17.5 A10,10 0 0 1 17.5,24.5 H4.5"/>
    <path id="U" d="M4.5,0 V28 A11.5,11.5 0 0 0 27.5,28 V0"/>
    <path id="Z" d="M0,4.5 H32 M0,39.5 H32 M28,6 L4,38"/>
    <path id="L" d="M4.5,0 V39.5 H32"/>
  </defs>

  <g fill="none" stroke="#ffffff">
    <!-- Puzzelstuk: knobbels boven en onder in het midden -->
    <path stroke-width="10" stroke-linejoin="round"
      d="M100,100 H184 V90 A26,26 0 1 1 216,90 V100 H300
         V144 H310 A26,26 0 1 1 310,176 H300 V300
         H216 V310 A26,26 0 1 1 184,310 V300 H100
         V226 H90 A26,26 0 1 1 90,194 H100 Z"/>

    <!-- 3x3 raster, middelste vak leeg -->
    <g stroke-width="9" stroke-linejoin="miter" stroke-linecap="butt">
      <use href="#P" x="129" y="123"/>
      <use href="#U" x="184" y="123"/>
      <use href="#Z" x="239" y="123"/>

      <use href="#U" x="129" y="178"/>
      <use href="#Z" x="239" y="178"/>

      <use href="#L" x="129" y="233"/>
      <use href="#L" x="184" y="233"/>
      <use href="#U" x="239" y="233"/>
    </g>
  </g>
</svg>
