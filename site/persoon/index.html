<header class="wrap top">

    <img src="/logo.svg?v=1.6.0-2fa112" width="44" height="44" alt="">
    <span>Puzzullu</span>

  <nav class="nav" aria-label="Pagina's">
    <a href="/">Overzicht</a>
    <a href="/statistieken/" aria-current="page">Statistieken</a>
    <a href="/generator/">Generator</a>
  </nav>
</header>

<main class="wrap stats persoon">
  <p class="terug"><a href="/statistieken/#mensen">← Alle mensen</a></p>
  <section class="hero">
    <h1 id="naam">Laden…</h1>
    <p id="sinds"></p>
  </section>
  <div id="pagina" hidden>
    <ul class="tiles" id="tiles"></ul>

    <section class="card reeks" id="reeks" aria-live="polite"></section>

    <section class="blok" id="blok-records">
      <h2>Records</h2>
      <div id="p-records"></div>
    </section>

    <section class="blok">
      <h2>Snelste tijden</h2>
      <p class="muted">Per aantal stukjes de snelste keer solo, en de snelste keer samen met anderen.</p>
      <div class="tabel-wrap"><table class="tabel" id="p-snelst"></table></div>
    </section>

    <section class="blok">
      <h2>Puzzelpartners</h2>
      <div class="tabel-wrap"><table class="tabel" id="p-partners"></table></div>
      <button type="button" class="link-btn" id="partners-meer" hidden></button>
    </section>

    <section class="blok">
      <h2 id="kal-kop">Wanneer puzzelt deze persoon?</h2>
      <div class="kalender" id="p-kalender"></div>
    </section>
  </div>
  <p class="muted" id="niet-gevonden" hidden></p>
