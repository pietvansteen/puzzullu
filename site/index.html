<head>

<link rel="icon" href="/logo.svg?v=0.5.0-48073e" type="image/svg+xml">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/style.css?v=0.5.0-48073e">
</head>
<body>
<header class="wrap top">
  <a class="brand" href="/" aria-label="Puzzullu, overzicht">
    <img src="/logo.svg?v=0.5.0-48073e" width="44" height="44" alt="">
    <span>Puzzullu</span>
  </a>
  <nav class="nav" aria-label="Pagina's">
    <a href="/" aria-current="page">Overzicht</a>
    <span class="soon" title="Komt binnenkort">Statistieken</span>
    <a href="/generator/">Generator</a>
  </nav>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Onze puzzels</h1>
    <p>Alle Jan van Haasteren-puzzels van Puzzullu: wie heeft welke, en hoe snel we ze gelegd hebben.</p>
  </section>
  <ul class="tiles" id="tiles" aria-live="polite"><li class="empty">Laden…</li></ul>

  <section class="tools" aria-label="Zoeken en filteren">
    <input type="search" id="zoek" placeholder="Zoek op naam (Engels, Nederlands of een andere uitgave)" aria-label="Zoek een puzzel" autocomplete="off">
    <details class="filters">
      <summary>Filters en weergave <span id="nfilters"></span></summary>
      <div class="filter-body">
        <fieldset><legend>Aantal stukjes</legend><div class="chips" id="f-stukjes"></div></fieldset>
        <fieldset><legend>Eigenaar</legend><div class="chips" id="f-eigenaar"></div></fieldset>
        <fieldset><legend>Gemaakt door</legend><div class="chips" id="f-makers"></div>
          <div class="mode" id="makers-mode" hidden>
            <label id="samen-optie"><input type="radio" name="makers-mode" id="samen"> Samen</label>
            <label><input type="radio" name="makers-mode" id="los"> Minstens één van hen</label>
          </div>
        </fieldset>
        <fieldset><legend>Met hoeveel</legend><div class="chips" id="f-groep"></div></fieldset>
        <fieldset><legend>Moeilijkheid</legend><div class="chips" id="f-rating"></div></fieldset>
        <fieldset class="slider"><legend>Tijd: <output id="tijd-out"></output></legend>
          <div class="range2" id="tijd-range">
            <input type="range" id="f-van" min="0" step="1" aria-label="Langer dan">
            <input type="range" id="f-tot" min="0" step="1" aria-label="Sneller dan">
          </div>
          <label class="optie" id="snelste-optie"><input type="checkbox" id="snelste"> Alleen de snelste tijd per versie telt
            <small>Bijvoorbeeld met "langer dan 1:00:00": de versies die nog nooit onder het uur zijn gelegd, ook als ze nog niet gelegd zijn.</small></label>
        </fieldset>
        <div class="row">
          <label class="select">Sorteren
            <select id="sort">
              <option value="az">Alfabetisch</option>
              <option value="minst">Minst gemaakt</option>
              <option value="meest">Meest gemaakt</option>
            </select>
          </label>
          <button type="button" class="link-btn" id="wis">Wis filters</button>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="toon-tekenaar"> Toon tekenaar &amp; jaar</label>
          <label><input type="checkbox" id="toon-rating"> Toon rating</label>
          <label><input type="checkbox" id="toon-alles"> Toon alle puzzels</label>
        </div>
      </div>
    </details>
    <div class="row count-row">
      <p class="count muted" id="count" aria-live="polite"></p>
      <button type="button" class="link-btn" id="uitklap" hidden>Laat alle tijden zien</button>
    </div>
  </section>

  <ul class="puzzels" id="lijst"><li class="empty">Laden…</li></ul>
  <p class="muted" id="updated"></p>
</main>

<footer class="wrap"><span>Puzzullu</span> <a class="version" href="/wat-is-nieuw/">v0.5.0 · Wat is nieuw</a></footer>
<script src="/shared.js?v=0.5.0-48073e"></script>
<script src="/overzicht.js?v=0.5.0-48073e"></script>
</body>
</html>
